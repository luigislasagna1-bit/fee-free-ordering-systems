# Fly.io config for the Nabil AI voice service.
# A live phone call holds one long WebSocket, so we keep at least one machine
# always running (never auto-stop mid-call) and health-check over HTTP.
app = "nabil-voice"
primary_region = "iad" # pick the region closest to your Twilio media region

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
