# Codemagic CI — cloud-Mac build for the Fee Free Order App (iOS).
#
# This builds the Capacitor iOS app (a WebView shell that loads the live
# kitchen at feefreeordering.com/kitchen + the native DirectPrinter plugin),
# signs it with the App Store distribution profile, and uploads it to
# TestFlight. No local Mac required.
#
# ── ONE-TIME SETUP (done in the Codemagic UI, not here) ──────────────────
#  1. Sign up at codemagic.io with the GitHub account that owns this repo and
#     add the repository.
#  2. In App Store Connect → Users and Access → Integrations → App Store
#     Connect API, create a key with access role "App Manager". Download the
#     .p8 (one time only), and note the Key ID + Issuer ID.
#  3. In Codemagic → Team settings → Integrations → Developer Portal, add that
#     key. NAME THE INTEGRATION EXACTLY:  ff-asc-key
#     (the `app_store_connect:` reference below must match this name).
#  4. Push this file; Codemagic auto-detects it and shows the "ios-kitchen"
#     workflow. Run it.
#
# Codemagic uses the API key to (a) auto-create the signing certificate +
# provisioning profile for com.feefreeordering.kitchen and (b) upload the
# build to TestFlight — so there are no certificates to manage by hand.

workflows:
  ios-kitchen:
    name: Fee Free Order App (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 2026-07-23 — Kitchen migrated to the Fee Free Ordering Inc. ORG (team
    # N537SW2VG2). Apple wouldn't free the old `com.feefreeordering.kitchen`
    # App ID ("in use by the App Store" — build-24 lock), so iOS uses a fresh
    # id `com.feefreeordering.kitchenapp` (Plan B). Android keeps `.kitchen`
    # (unchanged in capacitor.config.ts / android project). Signs via the
    # SAME `ff-asc-org` integration the driver app already ships under.
    integrations:
      app_store_connect: ff-asc-org
    environment:
      groups:
        # Secure variable group holding IOS_SIGNING_KEY_PEM — the stored iOS
        # distribution PRIVATE KEY (full PEM, multi-line). With it present,
        # every build REUSES one certificate instead of minting a new one, so
        # we never accumulate certs against Apple's distribution-cert limit.
        # Create this group + variable in the Codemagic UI (one-time). If the
        # group/variable is absent the signing step below falls back to minting
        # a fresh cert, so the build still works either way.
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.feefreeordering.kitchenapp"
      node: 22
    triggering:
      # Manual builds only for now (we trigger from the Codemagic UI). We can
      # add branch/tag triggers later once the pipeline is proven.
      events: []
    scripts:
      - name: Install npm dependencies
        # `npm install` (not `npm ci`) — ci fails fast if package-lock.json is
        # even slightly out of sync with package.json; install reconciles it.
        script: npm install --no-audit --no-fund
      - name: Capacitor sync (iOS)
        # Copies the web config + native plugins into the iOS project. This is a
        # Swift Package Manager Capacitor project (ios/App/CapApp-SPM/Package.swift),
        # NOT CocoaPods — there is no Podfile; Xcode resolves the Swift packages at
        # build time, so no separate install step is needed.
        script: npx cap sync ios
      - name: Strip driver-only background-geolocation from the kitchen SPM manifest
        # `cap sync` regenerates CapApp-SPM/Package.swift from EVERY installed
        # @capacitor* plugin in the SHARED node_modules — including the DRIVER's
        # @capacitor-community/background-geolocation. The kitchen app never
        # calls location, and linking it caused two real problems:
        #   1. capacitor-swift-pm 7.x pin vs 8.x elsewhere → unsolvable graph
        #      (xcodebuild exit 74, build 26).
        #   2. Apple ITMS-90683 on upload: the linked binary references location
        #      APIs, so App Store scanning demands NSLocation*UsageDescription
        #      purpose strings (build 29 email, 2026-07-23).
        # Adding fake location purpose strings to a kitchen app would be
        # dishonest and invites a reviewer question, so we REMOVE the plugin
        # from this app's manifest instead — fixing both at once. The App target
        # depends only on the CapApp-SPM umbrella package, so dropping a plugin
        # here simply leaves it unlinked; nothing in /kitchen references it.
        # (The driver workflow keeps it — that app genuinely needs GPS.)
        script: |
          set -e
          node -e '
            const fs = require("fs");
            const p = "ios/App/CapApp-SPM/Package.swift";
            const before = fs.readFileSync(p, "utf8");
            let out = before
              .split("\n")
              .filter((l) => !/BackgroundGeolocation/i.test(l))
              .join("\n")
              // a stripped last-entry would leave a dangling comma before ]
              .replace(/,(\s*\])/g, "$1");
            fs.writeFileSync(p, out);
            console.log(before === out ? "No background-geolocation entries found (nothing to strip)." : "Stripped background-geolocation from the kitchen SPM manifest.");
            console.log("--- resulting manifest:\n" + out);
          '
      - name: Verify SPM manifest + resolve packages (fail loudly, not at Build IPA)
        # Same guard as the driver workflow: a Windows-generated
        # CapApp-SPM/Package.swift has invalid backslash paths (exit 74).
        script: |
          set -e
          MANIFEST=ios/App/CapApp-SPM/Package.swift
          echo "--- $MANIFEST after sync:"
          cat "$MANIFEST"
          grep -q 'node_modules/@capacitor' "$MANIFEST"
          if grep -q '\\' "$MANIFEST"; then
            echo "ERROR: backslash paths in $MANIFEST (Windows-generated manifest reached CI)"; exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj -scheme App
      - name: Set up code signing (REUSE one cert if stored key is present)
        # CERT REUSE — stops repeat builds from piling up distribution certs
        # against Apple's limit.
        #
        # If IOS_SIGNING_KEY_PEM is set (secure var in the `ios_signing` group,
        # holding our stored distribution private key): write it out and let
        # `fetch-signing-files --create` find the matching certificate. On the
        # FIRST build it creates ONE cert from this key; EVERY build after
        # reuses it — no new certs, ever.
        #
        # If the variable is ABSENT (group not set up yet): fall back to the old
        # behavior — generate a key + mint a fresh cert — so the build still
        # works. (This path is the one that accumulates certs, so set up the
        # variable to avoid it.)
        #
        # `set -e` so any failure goes RED instead of silently passing. Note:
        # the reuse path mints NOTHING on a failed/iterating build, so retrying
        # a broken build is safe.
        script: |
          set -e
          keychain initialize
          if [ -n "$IOS_SIGNING_KEY_PEM" ]; then
            echo "Cert reuse: using stored distribution key (no new cert minted)."
            printf '%s\n' "$IOS_SIGNING_KEY_PEM" > /tmp/ff_signing_key.pem
          else
            echo "WARNING: IOS_SIGNING_KEY_PEM not set — minting a NEW distribution cert (counts against Apple's limit). Set up the ios_signing group to enable reuse."
            openssl genrsa -out /tmp/ff_signing_key.pem 2048
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key @file:/tmp/ff_signing_key.pem \
              --save
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/ff_signing_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (monotonic; higher than any prior upload)
        # CFBundleVersion must STRICTLY INCREASE on every TestFlight upload.
        # The old step called get-latest-testflight-build-number with the BUNDLE
        # id, but that command wants the numeric App Store app id — so it always
        # returned 0 and the version defaulted to 1. That worked once, then
        # collided ("bundle version 1 already used"). Codemagic's BUILD_NUMBER is
        # a per-app monotonic counter (already well past 1), so use it as the
        # source of truth, and still take the max with TestFlight's latest+1 in
        # case a higher version was ever uploaded by other means. Floor at 2
        # since version 1 is taken.
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          CI="${BUILD_NUMBER:-0}"
          [[ "$CI" =~ ^[0-9]+$ ]] || CI=0
          NEXT=$((LATEST + 1))
          if [ "$CI" -gt "$NEXT" ]; then NEXT="$CI"; fi
          if [ "$NEXT" -lt 2 ]; then NEXT=2; fi
          echo "CFBundleVersion -> $NEXT (TestFlight latest=$LATEST, CI build=$CI)"
          cd ios/App
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight (internal testers can install immediately). We
        # do NOT auto-submit to App Store review yet — that's a later step.
        submit_to_testflight: true

  # ── Branded Mobile App — per-TENANT customer shell (iOS) ────────────────
  # ONE parameterized workflow builds EVERY restaurant's branded app. Tenant
  # identity + credentials arrive per run as env vars (manual UI run for the
  # pilot; Codemagic REST `POST /builds` with environment.variables at GA):
  #
  #   FF_MANIFEST_JSON       base64 of the tenant build manifest (from
  #                          scripts/gen-build-manifest.ts)
  #   TENANT_ASC_KEY_P8      the RESTAURANT team's App Store Connect API key
  #   TENANT_ASC_KEY_ID      its key id
  #   TENANT_ASC_ISSUER_ID   its issuer id
  #   FF_GSERVICE_PLIST_B64  base64 GoogleService-Info.plist for this tenant's
  #                          Firebase iOS app registration (push)
  #
  # Signing runs against the RESTAURANT'S OWN Apple team (Apple 4.2.6: template
  # apps must live in the client's account) via explicit codemagic-cli-tools
  # flags — NOT the ff-asc-org integration, which is the platform's team. The
  # ios_signing group's IOS_SIGNING_KEY_PEM is reused across tenants: the first
  # build on a new team mints ONE distribution cert from the same private key
  # (one PEM to custody for the whole fleet).
  customer-ios:
    name: Branded Customer App (iOS, per-tenant)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "apps/customer-shell/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
    triggering:
      events: []
    scripts:
      - name: Install npm dependencies
        script: npm install --no-audit --no-fund
      - name: Decode tenant manifest
        script: |
          set -e
          [ -n "$FF_MANIFEST_JSON" ] || { echo "FF_MANIFEST_JSON missing"; exit 1; }
          mkdir -p store-assets/customer-builds/ci
          echo "$FF_MANIFEST_JSON" | base64 -d > store-assets/customer-builds/ci/manifest.json
          node -e "const m=require('./store-assets/customer-builds/ci/manifest.json'); console.log('tenant:', m.slug, m.bundleId); if(!m.bundleId||!m.serverUrl) process.exit(1);"
      - name: Generate tenant Capacitor config + scaffold iOS project (first run)
        script: |
          set -e
          node scripts/gen-customer-cap-config.mjs store-assets/customer-builds/ci/manifest.json
          if [ ! -d apps/customer-shell/ios ]; then
            node scripts/cap-customer.mjs add ios
          fi
      - name: Capacitor sync (iOS, CUSTOMER config)
        script: node scripts/cap-customer.mjs sync ios
      - name: Plugin allowlist guard (strip fleet plugin bleed — CI-fatal)
        script: node scripts/customer-plugin-allowlist.mjs
      - name: Generate tenant assets (icons + splash)
        script: node scripts/gen-customer-assets.js store-assets/customer-builds/ci/manifest.json
      - name: Inject tenant identity (bundle id, display name, deep-link domain)
        script: |
          set -e
          BUNDLE_ID=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').bundleId")
          APP_NAME=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').displayName")
          LINK_HOST=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').deepLinkHost")
          cd apps/customer-shell/ios/App
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" App/Info.plist
          cat > App/App.entitlements <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key><string>production</string>
            <key>com.apple.developer.associated-domains</key>
            <array><string>applinks:$LINK_HOST</string></array>
          </dict>
          </plist>
          EOF
          if [ -n "$FF_GSERVICE_PLIST_B64" ]; then
            echo "$FF_GSERVICE_PLIST_B64" | base64 -d > App/GoogleService-Info.plist
          fi
      - name: Verify SPM manifest + resolve packages (fail loudly, not at Build IPA)
        script: |
          set -e
          MANIFEST=apps/customer-shell/ios/App/CapApp-SPM/Package.swift
          echo "--- $MANIFEST after sync:"
          cat "$MANIFEST"
          grep -q 'node_modules/@capacitor' "$MANIFEST"
          if grep -q '\\' "$MANIFEST"; then
            echo "ERROR: backslash paths in $MANIFEST (Windows-generated manifest reached CI)"; exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project apps/customer-shell/ios/App/App.xcodeproj -scheme App
      - name: Set up code signing on the TENANT's team
        script: |
          set -e
          [ -n "$TENANT_ASC_KEY_P8" ] || { echo "TENANT_ASC_KEY_P8 missing (restaurant's ASC API key)"; exit 1; }
          keychain initialize
          printf '%s\n' "$TENANT_ASC_KEY_P8" > /tmp/tenant_asc_key.p8
          if [ -n "$IOS_SIGNING_KEY_PEM" ]; then
            printf '%s\n' "$IOS_SIGNING_KEY_PEM" > /tmp/ff_signing_key.pem
          else
            openssl genrsa -out /tmp/ff_signing_key.pem 2048
          fi
          BUNDLE_ID=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').bundleId")
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$TENANT_ASC_ISSUER_ID" \
            --key-id "$TENANT_ASC_KEY_ID" \
            --private-key @file:/tmp/tenant_asc_key.p8 \
            --certificate-key @file:/tmp/ff_signing_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (per-tenant monotonic from the manifest + TestFlight)
        script: |
          set -e
          BUNDLE_ID=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').bundleId")
          MANIFEST_VC=$(node -p "require('./store-assets/customer-builds/ci/manifest.json').versionCode")
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" \
            --issuer-id "$TENANT_ASC_ISSUER_ID" --key-id "$TENANT_ASC_KEY_ID" \
            --private-key @file:/tmp/tenant_asc_key.p8 2>/dev/null || echo 0)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          NEXT=$((LATEST + 1))
          if [ "$MANIFEST_VC" -gt "$NEXT" ]; then NEXT="$MANIFEST_VC"; fi
          echo "CFBundleVersion -> $NEXT (TestFlight latest=$LATEST, manifest=$MANIFEST_VC)"
          cd apps/customer-shell/ios/App
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Publish to the TENANT's TestFlight
        script: |
          app-store-connect publish \
            --path build/ios/ipa/*.ipa \
            --issuer-id "$TENANT_ASC_ISSUER_ID" \
            --key-id "$TENANT_ASC_KEY_ID" \
            --private-key @file:/tmp/tenant_asc_key.p8 \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  # ── Fee Free DELIVERY driver app (iOS) ──────────────────────────────────
  # Same pipeline as ios-kitchen, but for the driver app: a WebView shell of
  # feefreeordering.com/driver + background-location capability. Separate bundle
  # id (com.feefreeordering.driver) → its OWN App Store Connect app record under
  # the Fee Free Ordering Inc. ORG (2026-07-16) — signs via the ff-asc-org key
  # integration. The ios_signing group's IOS_SIGNING_KEY_PEM is REUSED: on the
  # first org build, fetch-signing-files --create mints a NEW distribution cert
  # under the org from the same private key (one key to back up, zero new PEMs).
  # The Kitchen workflow deliberately stays on ff-asc-key (old team) until the
  # Kitchen org migration (see IOS_APP_STORE_SUBMISSION.md D1/D3).
  # The one real difference: `cap sync` must target the DRIVER config, so this
  # workflow syncs via scripts/cap-driver.mjs (Capacitor 8 has no --config flag,
  # so the helper briefly swaps capacitor.config.ts to the driver config).
  ios-driver:
    name: Fee Free Delivery (iOS)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ff-asc-org
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios-driver/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.feefreeordering.driver"
      node: 22
    triggering:
      events: []
    scripts:
      - name: Install npm dependencies
        script: npm install --no-audit --no-fund
      - name: Capacitor sync (iOS, DRIVER config)
        # Syncs the ios-driver project (NOT ios/). The helper swaps the driver
        # config into capacitor.config.ts, runs `cap sync ios`, then restores.
        script: node scripts/cap-driver.mjs sync ios
      - name: Patch background-geolocation SPM constraint for Capacitor 8
        # @capacitor-community/background-geolocation 1.2.x pins
        # capacitor-swift-pm `from: "7.0.0"` (7.x only) while CapApp-SPM pins
        # exact 8.3.4 — an unsolvable graph (xcodebuild exit 74). No Cap-8
        # plugin release exists yet, so widen the constraint post-install.
        # Tolerant: skips silently once the plugin ships a fixed manifest.
        script: |
          set -e
          PKG=node_modules/@capacitor-community/background-geolocation/Package.swift
          if grep -q 'from: "7.0.0"' "$PKG"; then
            sed -i '' 's/from: "7.0.0"/from: "8.0.0"/' "$PKG"
            echo "Patched $PKG constraint 7.0.0 -> 8.0.0"
          else
            echo "Constraint already Capacitor-8 compatible, skipping."
          fi
      - name: Verify SPM manifest + resolve packages (fail loudly, not at Build IPA)
        # A cap sync run on WINDOWS writes backslash paths into
        # CapApp-SPM/Package.swift — invalid Swift string escapes that kill
        # xcodebuild with a bare exit 74. Assert the manifest is sane and
        # pre-resolve packages so any SwiftPM error prints HERE in full.
        script: |
          set -e
          MANIFEST=ios-driver/App/CapApp-SPM/Package.swift
          echo "--- $MANIFEST after sync:"
          cat "$MANIFEST"
          grep -q 'node_modules/@capacitor' "$MANIFEST"
          if grep -q '\\' "$MANIFEST"; then
            echo "ERROR: backslash paths in $MANIFEST (Windows-generated manifest reached CI)"; exit 1
          fi
          xcodebuild -resolvePackageDependencies \
            -project ios-driver/App/App.xcodeproj -scheme App
      - name: Set up code signing (REUSE one cert if stored key is present)
        script: |
          set -e
          keychain initialize
          if [ -n "$IOS_SIGNING_KEY_PEM" ]; then
            echo "Cert reuse: using stored distribution key (no new cert minted)."
            printf '%s\n' "$IOS_SIGNING_KEY_PEM" > /tmp/ff_signing_key.pem
          else
            echo "WARNING: IOS_SIGNING_KEY_PEM not set — minting a NEW distribution cert (counts against Apple's limit). Set up the ios_signing group to enable reuse."
            openssl genrsa -out /tmp/ff_signing_key.pem 2048
            app-store-connect certificates create \
              --type IOS_DISTRIBUTION \
              --certificate-key @file:/tmp/ff_signing_key.pem \
              --save
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/ff_signing_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number (monotonic; higher than any prior upload)
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          CI="${BUILD_NUMBER:-0}"
          [[ "$CI" =~ ^[0-9]+$ ]] || CI=0
          NEXT=$((LATEST + 1))
          if [ "$CI" -gt "$NEXT" ]; then NEXT="$CI"; fi
          if [ "$NEXT" -lt 2 ]; then NEXT=2; fi
          echo "CFBundleVersion -> $NEXT (TestFlight latest=$LATEST, CI build=$CI)"
          cd ios-driver/App
          agvtool new-version -all "$NEXT"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
